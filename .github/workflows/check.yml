name: Check entries
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest -q
      - run: python scripts/check_entry.py addons/*.json
      - name: index.json is up to date (a pull request merged by hand must carry the rebuilt index)
        if: github.event_name == 'push'
        run: |
          python scripts/build_index.py --out "$RUNNER_TEMP/index.json"
          diff -q index.json "$RUNNER_TEMP/index.json" || { echo "index.json is stale: run scripts/build_index.py and send the result as a pull request."; exit 1; }
