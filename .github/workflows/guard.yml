name: Guard pull requests
# Pull requests here come from the website's bot. This closes direct ones, checks the rest, and merges a plain
# Listed submission by itself. A person looks at anything else (Verified requests, odd changes).
#
# It runs from main (pull_request_target), never from the pull request's own files: from the pull request it only
# COPIES data (addons/ and pictures/) into a temp folder and reads it. No code from a pull request is ever run.
#
# Needs one repository variable: BOT_LOGINS = the GitHub account(s) the website's token belongs to, comma separated.
# Until it is set, nothing is closed or merged.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main, not the pull request
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BOTS: ${{ vars.BOT_LOGINS }}
        run: |
          set -euo pipefail
          FILES=$(gh pr diff "$PR" --name-only | tr '\n' ' ')
          LABELS=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          mkdir -p "$RUNNER_TEMP/head"
          git fetch --quiet origin "refs/pull/$PR/head"
          git archive FETCH_HEAD addons pictures 2>/dev/null | tar -x -C "$RUNNER_TEMP/head" || true
          python scripts/guard_pr.py --author "$AUTHOR" --bots "$BOTS" --files "$FILES" --labels "$LABELS" --head "$RUNNER_TEMP/head" > "$RUNNER_TEMP/verdict.json"
          cat "$RUNNER_TEMP/verdict.json"
          echo "action=$(jq -r .action "$RUNNER_TEMP/verdict.json")" >> "$GITHUB_OUTPUT"
          jq -r .message "$RUNNER_TEMP/verdict.json" > "$RUNNER_TEMP/message.txt"
      - name: Close (not from the website)
        if: steps.decide.outputs.action == 'close'
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}" }
        run: gh pr close "$PR" --comment "$(cat "$RUNNER_TEMP/message.txt")"
      - name: Tell the author what to fix
        if: steps.decide.outputs.action == 'fail'
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}" }
        run: |
          gh pr comment "$PR" --body "$(cat "$RUNNER_TEMP/message.txt")"
          exit 1
      - name: Waiting for a person
        if: steps.decide.outputs.action == 'hold'
        run: echo "HOLD $(cat "$RUNNER_TEMP/message.txt")"
      - name: Merge (Listed, all checks passed)
        if: steps.decide.outputs.action == 'merge'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # merge only the exact version we just checked; a push made with the workflow token does not start
          # other workflows, so start the index rebuild ourselves
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA"
          gh workflow run publish-index.yml
