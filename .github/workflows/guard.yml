name: Guard pull requests
# Pull requests here come from the website's bot. This closes direct ones, checks the rest, and hands a plain Listed
# submission to the sandbox (sandbox.yml), which test-runs the add-on and then merges it. A person looks at anything
# else (Verified requests, odd changes).
#
# It runs from main (pull_request_target), never from the pull request's own files: from the pull request it only
# COPIES data (addons/ and pictures/) into a temp folder and reads it. No code from a pull request is ever run here.
#
# Needs one repository variable: BOT_LOGINS = the GitHub account(s) the website's token belongs to, comma separated.
# Until it is set, nothing is closed or merged.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
permissions:
  contents: read
  pull-requests: write
  actions: write
concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main, not the pull request
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_LOGINS: ${{ vars.BOT_LOGINS }}
        run: scripts/ci_judge.sh "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.user.login }}" "${{ github.event.pull_request.head.sha }}"
      - name: Close (not from the website)
        if: steps.decide.outputs.action == 'close'
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}" }
        run: gh pr close "$PR" --comment "$(cat "$RUNNER_TEMP/message.txt")"
      - name: Tell the author what to fix
        if: steps.decide.outputs.action == 'fail'
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}" }
        run: |
          gh pr comment "$PR" --body "$(cat "$RUNNER_TEMP/message.txt")"
          exit 1
      - name: Waiting for a person
        if: steps.decide.outputs.action == 'hold'
        run: echo "HOLD $(cat "$RUNNER_TEMP/message.txt")"
      - name: Hand over to the sandbox
        if: steps.decide.outputs.action == 'merge'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh workflow run sandbox.yml -f pr="$PR" -f sha="$SHA"
