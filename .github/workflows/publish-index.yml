name: Publish index
# After a merge, rebuild index.json (the file the studio reads) and commit it if it changed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["addons/**", "scripts/build_index.py"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_index.py
      - name: Commit index.json if it changed
        run: |
          if [ -z "$(git status --porcelain -- index.json)" ]; then
            echo "index.json is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: rebuild index.json"
            git push
          fi
